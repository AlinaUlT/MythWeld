<span style="display: flex; align-items: center; gap: 8px"><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2f3b4d; display: flex"><span style="width: 100%; height: 4px; border-radius: 2px; background: #c94d4d"></span></span><span style="font-size: 12px; color: #97a1b9">12 / 12</span></span>

</button>

4" width="24" height="24" fill="none" stroke="currentColor" style="flex-shrink: 0; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.75" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg><span>Settings</span></button></nav>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"headingFont": {"editor": "enum", "options": ["EB Garamond", "Alegreya", "Lora", "Cormorant Garamond"], "default": "EB Garamond"}, "$preview": {"width": 360, "height": 800}}'>
class Component extends DCLogic {
  renderVals() {
    const f = this.props.headingFont ?? 'EB Garamond';
    return { hf: f + ', Georgia, serif' };
  }
